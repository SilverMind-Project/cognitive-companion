version: 2
updates:
  # Frontend: npm (frontend/package.json + frontend/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Vuetify 4 is a ground-up rewrite; stay on v3 stable until a dedicated
      # migration milestone is planned.
      - dependency-name: "vuetify"
        versions: [">=4.0.0"]
      # vue-router 5 ships with pinia+vite as required peers and a new
      # data-loader architecture. Stay on v4 until verified compatible.
      - dependency-name: "vue-router"
        versions: [">=5.0.0"]

  # Backend: Python via uv (backend/pyproject.toml + backend/uv.lock)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # protobuf 7.x requires the _pb2 generated files to be regenerated
      # with protoc 7.x from the continuous-tracking repo first.
      - dependency-name: "protobuf"
        versions: [">=7.0.0"]

  # Dockerfiles (base images in backend/Dockerfile and frontend/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (pin action versions to a SHA or tag)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
