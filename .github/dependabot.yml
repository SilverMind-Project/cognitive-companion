version: 2
updates:
  # Frontend: npm (frontend/package.json + frontend/package-lock.json), grouped
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      # Vuetify 4 is a ground-up rewrite; stay on v3 stable until a dedicated
      # migration milestone is planned.
      - dependency-name: "vuetify"
        versions: [">=4.0.0"]
      # vue-router 5 ships with pinia+vite as required peers and a new
      # data-loader architecture. Stay on v4 until verified compatible.
      - dependency-name: "vue-router"
        versions: [">=5.0.0"]

  # Backend: Python via uv (backend/pyproject.toml + backend/uv.lock), grouped
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # protobuf 7.x requires the _pb2 generated files to be regenerated
      # with protoc 7.x from the continuous-tracking repo first.
      - dependency-name: "protobuf"
        versions: [">=7.0.0"]

  # Dockerfiles: base runtimes (python, node) are pinned in lockstep with
  # backend/pyproject.toml, frontend/.nvmrc, and CI (verified by `make check-toolchain`).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "node"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (grouped)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
