[project]
name = "cognitive-companion"
version = "0.7.127"
description = "Privacy-first AI companion for senior care"
requires-python = ">=3.14"
license = "AGPL-3.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.46",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "httpx-ws>=0.9",
    "boto3>=1.35",
    "botocore>=1.35",  # imported directly for Config/ClientError (deptry DEP003); previously only a transitive boto3 dep
    "apscheduler>=3.10",
    "pillow>=12.0",
    "python-multipart>=0.0.28",
    "python-telegram-bot>=21.0",
    "tenacity>=9.1.4",
    "mcp[cli]>=1.9",
    "opencv-python-headless>=4.9",
    "numpy>=2.0",
    "pyjwt>=2.13",
    "redis[hiredis]>=8.0",
    "protobuf>=5.29",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3",
    "psycopg[pool]>=3.3",
    "alembic>=1.13",
    "jmespath>=1.0",
    "langchain-text-splitters>=0.3",
    "pillow-heif>=1.0",
    "pgvector>=0.3",
    "triton-shared>=0.1.0",
    "cts-contracts>=0.1.0",
    "lark>=1.3.1",
    "shapely>=2.1.2",
    "jsonschema>=4.23",
    "cachetools>=5",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
triton = [
    "tritonclient[all]>=2.51.0",
]
dev = [
    "ruff>=0.15",
    "mypy>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "coverage>=7.6",
    "httpx>=0.28.1",          # FastAPI TestClient dependency
    "httpx2>=2.0.0",          # starlette 1.2+ TestClient transport
    "testcontainers[postgres]>=4.0",
    "import-linter>=2.0.0",
    "deptry>=0.20",
]

[tool.uv.sources]
triton-shared = { git = "https://github.com/SilverMind-Project/triton-shared" }
# Shared CTS wire-contract vocabulary (SHARED-TYPES-PROPOSAL.md). Same git-source
# pattern as triton-shared; uv.lock pins the resolved commit for reproducibility.
cts-contracts = { git = "https://github.com/SilverMind-Project/cts-contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["integrations/proto", "scripts/*"]

[tool.ruff.lint]
# U6b: BLE001 (blind-except) guard — no silent fallbacks (rule 15).
#
# Documented BLE001 allowlist (paths relative to this pyproject.toml = backend/):
#
#   integrations/*.py — all integration clients are optional upstreams; CLAUDE.md
#     mandates "return None, [], or typed zero when upstream is disabled/unreachable;
#     no exceptions bubble."  Covers: HA, PersonIDClient, SceneAnalysis, TTS,
#     Telegram, eink_renderer, triton_embedding_client, LLM chain, etc.
#
#   channels/builtin/*.py — notification channels are fire-and-forget delivery;
#     a channel failure must not abort the pipeline step that triggered it.
#
#   websocket/*.py — WS broadcasts are non-required side-channels (audio, pipeline
#     events, identity revisions).  Broadcast failure must not undo business logic.
#
#   mcp/server.py, mcp/middleware.py — MCP tool handlers return structured errors
#     on failure; broad-except is the correct gateway pattern for tool execution.
#
#   tests/ — test utilities use broad-except for cleanup/teardown robustness.
#
# All other broad-excepts outside this allowlist must either:
#   a) re-raise after logging (transient errors on required paths), or
#   b) carry a per-site # noqa: BLE001 comment stating the reason.
extend-per-file-ignores = {"steps/_scaffold/__init__.py" = ["T201"], "integrations/*.py" = ["BLE001"], "channels/builtin/*.py" = ["BLE001"], "websocket/*.py" = ["BLE001"], "mcp/server.py" = ["BLE001"], "mcp/middleware.py" = ["BLE001"], "tests/**/*.py" = ["BLE001"]}

select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes (includes unused imports, undefined names)
    "I",     # isort
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade  modernize syntax
    "B",     # flake8-bugbear  common bug patterns
    "BLE",   # U6b: blind-except guard (BLE001) — no silent fallbacks (rule 15)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "PIE",   # flake8-pie  misc lint
    "PT",    # flake8-pytest-style
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print  flag print() left in code
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # Depends() in FastAPI param defaults is idiomatic
    "RUF012",  # ClassVar for mutable class attrs  too noisy for registries
]
# TCH/TC (flake8-type-checking: move type-only imports behind TYPE_CHECKING)
# is not enforced. This is an honest gap, not a half-enabled state — adopting
# it is a deliberate future decision (M15/C12: the previous select+ignore
# pair selected the ruleset and then fully ignored it, which is dead config
# that misrepresented what was enforced).

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
warn_return_any = false                # too noisy with untyped third-party libs
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false          # too noisy for gradual adoption
no_implicit_optional = true
strict_equality = true
enable_error_code = ["import"]         # catches broken imports at type-check time
exclude = ["tests/", "\\.venv/"]
ignore_errors = false
# httpx_ws context managers lack explicit type annotations
disable_error_code = ["var-annotated"]

# The foundational ``backend.core`` package is held to a stricter standard:
# every function must carry type annotations. The rest of the tree remains
# on gradual-adoption settings above.
[[tool.mypy.overrides]]
module = ["backend.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Strict-typing ratchet (see Makefile ``typecheck-ratchet`` + ``make check-all``).
# These packages have been driven to zero mypy errors AND hold the strict
# ``disallow_untyped_defs`` bar; the gate prevents regression. Add a package here
# only after it is green under these settings. The long-term goal is the whole
# tree; grow this list as modules are cleaned.
[[tool.mypy.overrides]]
module = [
    "backend.services.guided_task.*",
    "backend.steps.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "mypy_boto3_s3.*",
    "apscheduler.*",
    "google.*",
    "yaml.*",
    "cv2.*",
    "jwt.*",
    "pgvector.*",
    "triton_shared.*",
    "shapely.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Silence the known circular-FK SAWarning raised during test teardown
    # (see tests/conftest.py for context).
    "ignore::sqlalchemy.exc.SAWarning",
]
markers = [
    "integration: tests requiring testcontainers (skipped by default in make check)",
]

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/scripts/*",
    "backend/assets/*",
    "backend/**/__pycache__/*",
]

[tool.coverage.report]
# Ratcheted from measurement, not aspiration (M15/C11): the gate was
# configured but never executed in CI, so 65 was a guess. The first real
# measurement of `backend/tests/core` + `backend/tests/services` against
# `backend` (branch coverage, tests/scripts/assets omitted) was 45.35% on
# 2026-07-16. Floor set to measured-1, floored. Raise it in one-line steps
# as coverage improves; never lower it and never delete a test to pass it.
fail_under = 44
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# ── Dependency hygiene (deptry) ─────────────────────────────────────
# deptry's default exclude covers tests/, so dev-only tooling (pytest
# plugins, testcontainers, linters) is invisible to its usage scan and must
# be ignored explicitly below rather than left to trip DEP002.
[tool.deptry]
known_first_party = ["backend"]

[tool.deptry.per_rule_ignores]
DEP003 = [
    "dotenv",  # alembic/env.py imports it in a try/except with a working fallback if absent; deliberately optional, not a hard dependency
]
DEP002 = [
    "uvicorn",           # invoked via `uvicorn backend.main:app` CLI entrypoint, never imported
    "python-multipart",  # Starlette imports it internally for Form/File parsing; we never import it
    "psycopg",           # SQLAlchemy loads the driver dynamically via `postgresql+psycopg://`; [binary]/[pool] are runtime-only extras
    "pillow-heif",       # registers a Pillow HEIF plugin via entry-point discovery at Pillow import time
    "google-genai",      # optional `gemini` extra, only present when that feature is installed
    "tritonclient",      # optional `triton` extra, only present when that feature is installed
    "ruff",              # CLI-only lint tool
    "mypy",              # CLI-only type checker
    "pytest",            # test runner, used only under tests/ (excluded from deptry's scan by default)
    "pytest-asyncio",    # pytest plugin, used only under tests/
    "pytest-cov",        # pytest plugin, used only under tests/
    "coverage",          # driven via pytest-cov / `make coverage-gate`, used only under tests/
    "httpx2",            # starlette TestClient transport dependency, used only under tests/
    "testcontainers",    # imported in tests/conftest.py, excluded from deptry's scan by default
    "import-linter",     # CLI-only (`lint-imports`)
    "deptry",            # CLI-only (this tool)
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
]

# ── Import Linter ─────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["backend"]
# Exclude TYPE_CHECKING-only imports from contract analysis: they have no runtime
# effect and are guarded by if TYPE_CHECKING: blocks, so they do not create real
# circular or forbidden runtime dependencies.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "R2: filters and steps must not read legacy CTS location tables directly"
type = "forbidden"
source_modules = [
    "backend.filters",
    "backend.steps",
]
forbidden_modules = [
    "backend.services.cts.location_repository",
]
# person_tracking is a service-layer wrapper that legitimately instantiates
# SqlAlchemyLocationRepository as part of its camera-event write path.
# Steps access it only through the service interface (process_camera_event,
# record_activity), never by importing the repository directly.
# This ignore_imports entry allows the transitive path so the contract
# catches only direct step→repository imports (the actual R2 violation).
ignore_imports = [
    "backend.steps.builtin.person_identification -> backend.services.person_tracking",
]

[[tool.importlinter.contracts]]
name = "U2-T8: MCP module may not bypass the service layer (no direct repository imports)"
type = "forbidden"
source_modules = [
    "backend.mcp",
]
forbidden_modules = [
    "backend.services.person_location.repositories",
]

# U6a evidence: PersonTrackingService is LIVE (U6a dead-code audit 2026-05-29).
# Live importers:
#   backend.main (lifespan wiring + HA polling scheduler)
#   backend.steps.builtin.person_identification (CameraFrameContext + process_camera_event)
#   backend.steps.builtin.daily_report (person-id lookup via _db_factory)
#   backend.steps.base (TYPE_CHECKING annotation)
#   backend.services.activity.service (record_activity + query delegation)
# PersonTrackingService owns: camera-event processing (face anchors → PersonLocationService),
# HA sensor polling (room presence), and activity recording.
# It is NOT removable: U2 retired its MCP read path, but the write paths above are live.
# This comment is the U6a evidence record.  No module was removed.
#
# U6a: U4-deleted views (CTSDashboardView, CTSPresenceView, SignalExplorerView,
# PresenceTimelineView) have no backend modules to guard; they were frontend-only.
# The three CTS stream consumers (tracking_event, identity_revision, dementia_signal,
# scene_sample) are live; no dead subscriber modules found.
#
# import-linter guard: prevent re-introduction of retired U4 dead module paths.
[[tool.importlinter.contracts]]
name = "U4: retired view modules must not be re-added as backend modules"
type = "forbidden"
source_modules = [
    "backend",
]
forbidden_modules = [
    "backend.services.person_location_legacy",
]

# M20: backend.bootstrap is the composition root (backend/bootstrap/README.md).
# Wiring never reaches into HTTP handlers.
[[tool.importlinter.contracts]]
name = "M20: backend.bootstrap may not import backend.routers"
type = "forbidden"
source_modules = [
    "backend.bootstrap",
]
forbidden_modules = [
    "backend.routers",
]

# M20: wiring is not an API -- only backend.main constructs the app from it.
# backend.bootstrap is deliberately absent from source_modules so its own
# internal cross-module imports (e.g. cts.py calling presence.wire_presence)
# are not flagged.
[[tool.importlinter.contracts]]
name = "M20: only backend.main may import backend.bootstrap"
type = "forbidden"
source_modules = [
    "backend.channels",
    "backend.core",
    "backend.filters",
    "backend.integrations",
    "backend.mcp",
    "backend.models",
    "backend.routers",
    "backend.schemas",
    "backend.services",
    "backend.steps",
    "backend.websocket",
]
forbidden_modules = [
    "backend.bootstrap",
]
# backend.tests is deliberately not in source_modules: tests legitimately
# import backend.main (the composed app) throughout, which transitively
# imports backend.bootstrap.lifespan -- that is not the "wiring reached
# from application code" case this contract guards against.
#
# backend.routers.activities imports backend.main directly (a pre-existing
# pattern, e.g. to reach app.state from a router function body); the same
# transitive reasoning applies.
ignore_imports = [
    "backend.routers.activities -> backend.main",
]
