[project]
name = "cognitive-companion"
version = "2.0.0"
description = "Privacy-first AI companion for senior care"
requires-python = ">=3.11"
license = "AGPL-3.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "boto3>=1.35",
    "apscheduler>=3.10",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "tenacity>=9.1.4",
    "mcp[cli]>=1.9",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyjwt[cryptography]>=2.8",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "coverage>=7.6",
    "httpx>=0.27",          # FastAPI TestClient dependency
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── Ruff ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes (includes unused imports, undefined names)
    "I",     # isort
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade  modernize syntax
    "B",     # flake8-bugbear  common bug patterns
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking  move type-only imports behind TYPE_CHECKING
    "RUF",   # ruff-specific rules
    "PIE",   # flake8-pie  misc lint
    "PT",    # flake8-pytest-style
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print  flag print() left in code
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # Depends() in FastAPI param defaults is idiomatic
    "RUF012",  # ClassVar for mutable class attrs  too noisy for registries
    "TCH",     # type-checking imports  adopt incrementally
    "TC",      # type-checking imports (older alias)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── Mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = false                # too noisy with untyped third-party libs
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false          # too noisy for gradual adoption
no_implicit_optional = true
strict_equality = true
enable_error_code = ["import"]         # catches broken imports at type-check time
exclude = ["tests/", "\\.venv/"]

# The foundational ``backend.core`` package is held to a stricter standard:
# every function must carry type annotations. The rest of the tree remains
# on gradual-adoption settings above.
[[tool.mypy.overrides]]
module = ["backend.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "mypy_boto3_s3.*",
    "apscheduler.*",
    "google.*",
    "yaml.*",
    "mcp.*",
    "uvicorn.*",
    "cv2.*",
    "jwt.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Silence the known circular-FK SAWarning raised during test teardown
    # (see tests/conftest.py for context).
    "ignore::sqlalchemy.exc.SAWarning",
]

# ── Coverage ─────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/scripts/*",
    "backend/assets/*",
    "backend/**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
