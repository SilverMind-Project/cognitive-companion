[project]
name = "cognitive-companion"
version = "2.0.0"
description = "Privacy-first AI companion for senior care"
requires-python = ">=3.11"
license = "AGPL-3.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "boto3>=1.35",
    "apscheduler>=3.10",
    "structlog>=24.0",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
