# Cognitive Companion v2 - Authentication & Authorization
#
# API keys for human users, services, and AI agents.
# Device keys are 8-char uppercase alphanumeric (A-Z, 0-9) used by
# hardware devices that cannot set HTTP headers.

api_keys:
  - key: "${CC_ADMIN_API_KEY}"
    name: "Admin"
    permissions:
      - "admin"

  - key: "${CC_CAREGIVER_API_KEY}"
    name: "Caregiver"
    permissions:
      - "caregiver"

  - key: "${CC_MCP_API_KEY}"
    name: "OpenClaw Agent"
    permissions:
      - "mcp_readonly"
      - "rules:write_via_mcp"

  # CTS operator key: full camera-management and calibration access.
  - key: "${CC_OPERATOR_API_KEY}"
    name: "CTS Operator"
    permissions:
      - "operator"

  # CTS caregiver-admin key: read + calibrate, no write.
  - key: "${CC_CAREGIVER_ADMIN_API_KEY}"
    name: "Caregiver Admin"
    permissions:
      - "caregiver_admin"

  # rtsp-ingress service key: read camera roster for reconciliation only.
  - key: "${CC_INGRESS_API_KEY}"
    name: "RTSP Ingress Service"
    permissions:
      - "cts_ingress"

device_keys:
  - key: "RCAM0001"
    name: "Kitchen reCamera"
    device_type: "recamera"
    sensor_id: "recamera_kitchen1"
    permissions:
      - "device:recamera"
  - key: "RCAM0002"
    name: "Kitchen reCamera2"
    device_type: "recamera"
    sensor_id: "recamera_kitchen2"
    permissions:
      - "device:recamera"
  - key: "RCAM0003"
    name: "Living Room reCamera"
    device_type: "recamera"
    sensor_id: "recamera_livingroom"
    permissions:
      - "device:recamera"
  - key: "RTRM0001"
    name: "Living Room reTerminal"
    device_type: "reterminal"
    sensor_id: "reterminal_living"
    permissions:
      - "device:reterminal"
      - "image:read"
  - key: "RTRM0002"
    name: "Guest Bedroom reTerminal"
    device_type: "reterminal"
    sensor_id: "reterminal_guestbedroom"
    permissions:
      - "device:reterminal"
      - "image:read"
# Permission map - abstract names to endpoint patterns (fnmatch syntax).
permission_map:
  admin:
    - "*"

  caregiver:
    - "GET /api/v1/*"
    - "POST /api/v1/persons/*/enroll"
    - "DELETE /api/v1/persons/*/enrollment"
    - "GET /api/v1/conversations/*"
    - "GET /api/v1/activities*"
    - "GET /api/v1/workflows*"
    - "GET /ws/cts"
    - "GET /ws/pipeline"
    # CTS read-only permissions
    - "cts.view"
    # CTS identity: view PH data (N2)
    - "cts.identity.view"
    - "cts.live.subscribe"
    - "cts.signals.view"
    - "cts.signals.delete"
    - "cts.cameras.read"
    - "cts.keyframes.view"
    # CTS presence timeline (N5)
    - "cts.presence.view"
    - "GET /api/v1/cts/presence/*"
    - "GET /api/v1/cts/presence-config"
    - "POST /api/v1/cts/presence-config/reload"
    # M2: calibration health (read-only)
    - "GET /api/v1/cts/diagnostics/calibration"
    # M2: heatmap analytics
    - "cts.analytics.heatmap.view"
    - "GET /api/v1/cts/analytics/heatmap"
    # M3: gait mobility trend
    - "cts.gait.trend.view"
    - "GET /api/v1/cts/gait/trend"
    # Knowledge repository endpoints
    - "GET /api/v1/knowledge/documents*"
    - "POST /api/v1/knowledge/documents*"
    - "PATCH /api/v1/knowledge/documents*"
    - "DELETE /api/v1/knowledge/documents*"
    - "GET /api/v1/knowledge/layouts*"
    - "GET /api/v1/info-cards*"
    - "POST /api/v1/info-cards*"
    - "PATCH /api/v1/info-cards*"
    - "DELETE /api/v1/info-cards*"
    - "GET /api/v1/quizzes*"
    - "POST /api/v1/quizzes*"
    - "PATCH /api/v1/quizzes*"
    - "DELETE /api/v1/quizzes*"
    - "GET /api/v1/knowledge-interactions*"
    - "POST /api/v1/companion-surfaces"
    - "PATCH /api/v1/companion-surfaces/*"
    - "room_zones:read"
    - "room_zones:write"
    - "routines:read"
    - "routines:write"
    - "guided_sessions:read"
    - "guided_sessions:takeover"
    - "guided_metrics:read"
    - "gate_graphs:read"
    - "gate_graphs:write"

  caregiver_admin:
    - "GET /api/v1/*"
    - "POST /api/v1/cts/identity/*"
    - "GET /api/v1/activities*"
    - "GET /ws/cts"
    - "GET /ws/pipeline"
    # CTS permissions for caregiver admin
    - "cts.view"
    # CTS identity PH surface (N2)
    - "cts.identity.view"
    - "cts.identity.correct"
    - "cts.live.subscribe"
    - "cts.signals.view"
    - "cts.signals.delete"
    - "cts.keyframes.view"
    - "cts.cameras.read"
    - "cts.cameras.write"
    - "cts.calibrate"
    - "cts.bboxes.write"
    - "cts.identity.correct.batch"
    - "cts.identity.read_enriched"
    - "persons.read"
    - "persons.write_overrides"
    - "cts.replay"
    # M3: bbox annotation endpoints
    - "PUT /api/v1/cts/identity/bboxes/*/override"
    - "GET /api/v1/cts/identity/keyframes/*/bboxes"
    # M2: diagnostics and transit zones
    - "GET /api/v1/cts/diagnostics/calibration"
    - "GET /api/v1/cts/transit-zones*"
    - "POST /api/v1/cts/transit-zones*"
    - "PATCH /api/v1/cts/transit-zones/*"
    - "DELETE /api/v1/cts/transit-zones/*"
    # CTS presence timeline (N5)
    - "cts.presence.view"
    - "GET /api/v1/cts/presence/*"
    # CTS calibration health (N6)
    - "cts.calibration.view"
    - "GET /api/v1/cts/calibration/health"
    # CTS signal evidence + explorer (N7)
    - "cts.signals.evidence.view"
    - "GET /api/v1/cts/signals/*/evidence"
    - "GET /api/v1/cts/signals/explorer"
    # CTS weekly reports (N7)
    - "cts.reports.weekly.view"
    - "POST /api/v1/cts/reports/weekly"
    # M2: heatmap analytics
    - "cts.analytics.heatmap.view"
    - "GET /api/v1/cts/analytics/heatmap"
    # M3: gait mobility trend
    - "cts.gait.trend.view"
    - "GET /api/v1/cts/gait/trend"
    - "POST /api/v1/companion-surfaces"
    - "PATCH /api/v1/companion-surfaces/*"
    - "room_zones:read"
    - "room_zones:write"
    - "routines:read"
    - "routines:write"
    - "guided_sessions:read"
    - "guided_sessions:takeover"
    - "guided_metrics:read"

  operator:
    - "*"
    # Explicit CTS permissions (required by CI check: no router references
    # a permission not listed in auth.yaml)
    - "cts.cameras.write"
    - "cts.calibrate"
    - "cts.bboxes.write"
    - "household:read"
    - "household:write"

  mcp_readonly:
    - "GET /api/v1/rooms*"
    - "GET /api/v1/sensors*"
    - "GET /api/v1/signals/feed*"
    - "GET /api/v1/events*"
    - "GET /api/v1/rules*"
    - "GET /api/v1/occupancy*"
    - "GET /api/v1/persons*"
    - "GET /api/v1/activities*"
    - "GET /api/v1/workflows*"
    - "GET /api/v1/interactive-responses*"
    - "GET /mcp*"
    - "POST /mcp*"
    - "GET /api/v1/image/*"
    - "GET /api/v1/ha/media-players"
    - "GET /api/v1/ha/entities"

  rules:write_via_mcp:
    - "POST /api/v1/rules/import"
    - "POST /api/v1/rules/import/preview"

  # VG08: gate-graph (vision-confirm callable rule) authoring.
  gate_graphs:read:
    - "GET /api/v1/gate-graphs"
    - "GET /api/v1/gate-graphs/*"
    - "GET /api/v1/gate-presets"
  gate_graphs:write:
    - "POST /api/v1/gate-graphs"
    - "POST /api/v1/gate-graphs/*"

  cts_ingress:
    - "GET /api/v1/cts/cameras"
    - "GET /api/v1/cts/overlap_groups"
    - "GET /api/v1/cts/calibration/adjacency"
    - "GET /api/v1/cts/transit-zones"
    - "GET /api/v1/rooms*"
    - "GET /api/v1/household/floor-plan"

  "device:recamera":
    - "POST /api/v1/device/recamera"

  "device:reterminal":
    - "POST /api/v1/device/reterminal"
    - "POST /api/v1/companion-surfaces/*/heartbeat"

  "image:read":
    - "GET /api/v1/image/*"

  "companion_surfaces:read":
    - "GET /api/v1/companion-surfaces*"

  "companion_surfaces:write":
    - "POST /api/v1/companion-surfaces"
    - "PATCH /api/v1/companion-surfaces/*"

  "companion_surfaces:heartbeat":
    - "POST /api/v1/companion-surfaces/*/heartbeat"

  "room_zones:read":
    - "GET /api/v1/rooms/*/zones"
    - "GET /api/v1/persons/*/current-zone"

  "room_zones:write":
    - "POST /api/v1/rooms/*/zones"
    - "PATCH /api/v1/zones/*"
    - "DELETE /api/v1/zones/*"

  "routines:read":
    - "GET /api/v1/routines"
    - "GET /api/v1/routines/*"

  "routines:write":
    - "POST /api/v1/routines"
    - "PATCH /api/v1/routines/*"
    - "DELETE /api/v1/routines/*"
    - "PUT /api/v1/routines/*/steps"
    - "POST /api/v1/routines/*/test-run"

  "guided_sessions:read":
    - "GET /api/v1/guided-sessions"
    - "GET /api/v1/guided-sessions/*/detail"

  "guided_sessions:takeover":
    - "POST /api/v1/guided-sessions/*/takeover"
    - "POST /api/v1/guided-sessions/*/say"
    - "POST /api/v1/guided-sessions/*/advance"
    - "POST /api/v1/guided-sessions/*/complete"
    - "POST /api/v1/guided-sessions/*/release"

  "guided_metrics:read":
    - "GET /api/v1/guided-metrics/*"
