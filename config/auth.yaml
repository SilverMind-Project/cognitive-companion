# Cognitive Companion v2 - Authentication & Authorization
#
# API keys for human users, services, and AI agents.
# Device keys are 8-char uppercase alphanumeric (A-Z, 0-9) used by
# hardware devices that cannot set HTTP headers.
#
# Authorization uses named D4 <resource>:<action> permission tokens.
# Roles are token sets defined exclusively under roles: below.

api_keys:
  - key: "${CC_ADMIN_API_KEY}"
    name: "Admin"
    roles:
      - "admin"

  - key: "${CC_CAREGIVER_API_KEY}"
    name: "Caregiver"
    roles:
      - "caregiver"

  - key: "${CC_MCP_API_KEY}"
    name: "OpenClaw Agent"
    roles:
      - "mcp_readonly"
      - "mcp_rules_import"

  - key: "${CC_OPERATOR_API_KEY}"
    name: "CTS Operator"
    roles:
      - "operator"

  - key: "${CC_CAREGIVER_ADMIN_API_KEY}"
    name: "Caregiver Admin"
    roles:
      - "caregiver_admin"

  - key: "${CC_INGRESS_API_KEY}"
    name: "RTSP Ingress Service"
    roles:
      - "cts_ingress"

device_keys:
  - key: "RCAM0001"
    name: "Kitchen reCamera"
    device_type: "recamera"
    sensor_id: "recamera_kitchen1"
    roles:
      - "device_recamera"
  - key: "RCAM0002"
    name: "Kitchen reCamera2"
    device_type: "recamera"
    sensor_id: "recamera_kitchen2"
    roles:
      - "device_recamera"
  - key: "RCAM0003"
    name: "Living Room reCamera"
    device_type: "recamera"
    sensor_id: "recamera_livingroom"
    roles:
      - "device_recamera"
  - key: "RTRM0001"
    name: "Living Room reTerminal"
    device_type: "reterminal"
    sensor_id: "reterminal_living"
    roles:
      - "device_reterminal"
  - key: "RTRM0002"
    name: "Guest Bedroom reTerminal"
    device_type: "reterminal"
    sensor_id: "reterminal_guestbedroom"
    roles:
      - "device_reterminal"

# Role token sets: every route, WebSocket, and MCP tool declares one D4 token.
# admin lists all admin-only D4 tokens alongside "*" so every declared token
# appears explicitly in at least one role (enforced at startup and in CI).
roles:
  admin:
    - "*"
    - "activities.sessions:write"
    - "admin.config:write"
    - "cts.calibration:calibrate"
    - "cts.cameras:write"
    - "cts.identity:correct"
    - "cts.keyframes:write"
    - "cts.signals.suppressions:delete"
    - "cts.signals.suppressions:write"
    - "cts.signals:acknowledge"
    - "cts.signals:delete"
    - "gate_graphs:write"
    - "guided_sessions:takeover"
    - "ha:write"
    - "household:write"
    - "image:delete"
    - "image:write"
    - "medication:write"
