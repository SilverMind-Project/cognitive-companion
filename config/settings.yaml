# Cognitive Companion v2 - Main Settings
# Environment variables can be interpolated with ${ENV_VAR} syntax.

app:
  name: "Cognitive Companion"
  version: "2.0.0"
  timezone: "America/New_York"
  debug: false
  # External origin for links in outbound notifications, e.g. https://home.example.net.
  # Empty keeps relative links for in-app surfaces.
  public_base_url: ""
  # Display names for resident-facing language codes (M27/D15/G5). Used to
  # resolve Routine.language_override into the agent's language directive
  # and to constrain the Routine Builder's language select. An unmapped
  # code degrades loudly (backend/services/guided_task/language.py) rather
  # than silently mistranslating.
  language_names:
    ta: "Chennai Tamil"
    en: "simple English"

server:
  host: "0.0.0.0"
  port: 8000

cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "https://nanai.khoofia.com"

database:
  # PostgreSQL connection (replaces SQLite)
  # Connection string format: postgresql+psycopg://{user}:{password}@{host}:{port}/{db}
  url: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  
  # Connection pool settings
  pool_size: 5              # Number of connections to maintain in the pool
  max_overflow: 10          # Maximum number of connections to create beyond pool_size
  pool_timeout: 30          # Seconds to wait before giving up on getting a connection
  pool_recycle: 3600        # Seconds before recycling a connection (1 hour)
  pool_pre_ping: true       # Test connections for liveness before using them
  
  # Echo SQL statements to logs (set to true for debugging)
  echo: false

# LLM provider configuration
llm:
  # Named model registry for the unified llm_call pipeline step.
  # Each entry is independently selectable per step via its id.
  #
  # api_type:         "openai"  = /v1/chat/completions (vLLM, llama.cpp, etc.)
  #                   "ollama"  = /api/chat
  # capabilities:     subset of [text, vision, translation]
  # guided_decoding:  true for vLLM (passes guided_json); false for llama.cpp
  #                   (appends schema as a prompt instruction instead)
  models:
    - id: "cosmos_reason2"
      name: "Cosmos Reason2 8B (Vision)"
      api_type: "openai"
      base_url: "${VISION_MODEL_URL}"
      model: "nvidia/Cosmos-Reason2-8B"
      capabilities: ["text", "vision"]
      max_tokens: 16000
      timeout: 120
      guided_decoding: true
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

    - id: "gemma-4-26B-A4B-it"
      name: "Gemma 4 26B (General)"
      api_type: "openai"
      base_url: "${GEMMA_MODEL_URL}"
      model: "gemma-4-26B-A4B-it"
      capabilities: ["text", "vision", "translation"]
      max_tokens: 32000
      timeout: 120
      guided_decoding: false
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

    - id: "qwen-3.6-35b"
      name: "Qwen 3.6 35b MOE (General)"
      api_type: "openai"
      base_url: "${GEMMA_MODEL_URL}"
      model: "qwen-3.6-35b"
      capabilities: ["text", "vision", "translation"]
      max_tokens: 32000
      timeout: 180
      guided_decoding: false
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

  # Admission control (DL-M09): the single choke point in front of every
  # local (Spark-hosted) vision/text LLM provider. Vision lane defaults to 1
  # (the Spark serves one heavy vision request well, two badly); the text
  # lane is cheaper but still competes for the same GPU. A queued call
  # older than queue_timeout_s fails closed rather than piling up.
  admission:
    max_concurrent_vision: 1
    max_concurrent_text: 2
    queue_timeout_s: 20

  realtime:
    provider: "gemini"
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-3.1-flash-live-preview"
    keepalive_interval: 25
    idle_timeout: 120
    system_instruction: >
      The user is a senior citizen living in Knoxville, Tennessee. They are
      originally from India. They may have limited mobility and may not be
      tech-savvy. Use a calm female voice. Process and respond in either simple English (Tamil accent),
      or in simple Chennai Tamil or Tanglish (a mix of Tamil spoken in Chennai
      mixed with English words). DO NOT use any other languages or accents.
      Keep responses concise and easy to understand. DO NOT infer the emotional
      state of the user. Ignore Minimal Input such as '...' or 'um' unless the
      user explicitly says to interpret them.
      For countable or duration questions about daily life (medication, meals,
      TV time), call get_daily_report or get_person_timeline and answer only
      from their data; never estimate a count from a scene description.
      Phrase answers to match the evidence: a guided-companion-completed
      routine is "she completed X with me", a vision/sensor inference is "I
      detected X, I cannot confirm more", and no data is "I have no record of
      that today".

# TTS configuration (tts-service on port 8200)
tts:
  url: "${TTS_API_URL}"
  default_model: "svara"
  default_voice: "ta_female"
  default_speed: 0.92
  default_language: "ta"
  # Style tag injected when no tag is present in the text.
  # Valid values: neutral, formal, chat, clear, happy, surprise, sad,
  #               fear, anger, disgust, narrative, enthusiastic, laugh, yawn, angry
  default_style: "happy"

# Home Assistant integration
homeassistant:
  url: "${HOME_ASSISTANT_URL}"
  token: "${HOME_ASSISTANT_TOKEN}"
  poll_interval_seconds: 30

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "ai-media"
  config_bucket: "cognitive-companion"
  secure: false
  presigned_expiry_hours: 24

# Event aggregation
event_aggregator:
  batch_size: 5
  window_seconds: 30
  cooldown_seconds: 60
  media_retention_minutes: 30
  # Per-camera image ceiling for reCamera. Devices self-limit, so zero disables it.
  image_rate_per_second: 0.0
  # Zero uses automatic burst capacity, with a minimum of one token.
  image_rate_burst: 0.0

# Conversation history
conversation:
  history_ttl_minutes: 120
  max_turns: 50

# Guided task companion
guided_task:
  max_step_attempts: 3
  step_timeout_s: 300
  resume_grace_s: 600
  safety_tick_s: 20
  escalation_grace_s: 1800
  transcript_retention_days: 30
  # Ceiling on how long guided_task_start parks its owning pipeline execution,
  # regardless of the computed summon + routine-scale budget. A safety net for
  # a wedged session, not the normal resume path (M25/G6).
  max_pipeline_park_s: 7200
  escalation_channels: ["telegram", "pwa_popup_text"]
  summon_channels: ["ha_speaker_tts", "pwa_popup_text"]
  rephrase_via: "agent"
  # Literal-TTS summon announcement, per resident language (M27/D15/G5).
  # Resolution order: Routine.language_override, then tts.default_language,
  # then "en". A resolved language missing here falls back to "en" and logs
  # guided_summon_language_missing (backend/services/guided_task/service.py).
  summon_messages:
    en: "Please come to the companion screen when you are ready for your routine."
    ta: "நீங்க ரெடி ஆன உடனே, கொஞ்சம் அந்த கம்பேனியன் ஸ்க்ரீனுக்கு (companion screen) வாங்க."
  vision:
    # Camera count cap for the D5 cascade, independent of max_frames (the
    # per-camera frame budget below). Overridable per profile via
    # vision.confirm.max_cameras / vision.watch.max_cameras (M28/G11).
    max_cameras: 3
    confirm:
      window_s: 20
      max_frames: 9
      min_confidence: 0.7
      min_interval_s: 15
      max_disagreements: 2
    watch:
      enabled: false
      tick_s: 20
      window_s: 4
      max_frames: 3
      auto_advance: false
      auto_advance_k: 3
    gate_node_timeout_s: 30

# WebSocket
websocket:
  max_connections: 10
  audio_backend: "gemini_live"
  lazy_connect: true

# MCP server
mcp:
  enabled: true
  tools:
    - "get_rooms"
    - "get_sensors"
    - "get_room_occupancy"
    - "get_recent_images"
    - "list_keyframe_frames"
    - "propose_identity_correction"
    - "get_identity_correction_job"
    - "get_light_level"
    - "get_signals_feed"
    - "get_event_logs"
    - "get_rules"
    - "get_conversation_history"
    - "get_person_locations"
    - "get_person_sightings"
    - "get_person_activities"
    - "get_workflow_executions"
    - "get_rule_pipeline"
    - "trigger_rule"
    - "get_eink_display_status"
    - "get_enrolled_persons"
    - "get_local_datetime"
    - "get_weather"
    - "get_recent_scene_objects"
    - "get_scene_observations"
    - "get_person_movements"
    - "get_room_trend"
    - "search_similar_scenes"
    - "submit_quiz_answer"
    - "get_current_quiz_question"
    - "complete_quiz_session"
    - "get_heatmap"
    - "get_gait_trend"
    - "acknowledge_dementia_signal"
    - "get_guided_completion_summary"
    - "get_guided_attempts_per_step"
    - "get_guided_time_to_complete"
    - "get_guided_abandonment"
    - "get_guided_escalation_breakdown"
    - "get_guided_vision_agreement"
    - "get_guided_time_of_day"
    - "record_resident_preference"
  gemini_tools:
    - "get_rooms"
    - "get_room_occupancy"
    - "get_person_locations"
    - "get_signals_feed"
    - "get_weather"
    - "get_recent_scene_objects"
    - "get_room_trend"
    - "get_person_movements"
    - "get_local_datetime"
    - "get_person_activities"
    - "get_enrolled_persons"
    # DL-M04: activity ledger query surface (daily-living countable/duration
    # questions -- medication/TV/meals). Never answer these by aggregating
    # semantic-memory captions (DL2); always call these tools.
    - "get_person_timeline"
    - "get_daily_report"
    - "get_open_sessions"
    - "submit_user_response"
    - "query_knowledge_base"
    - "submit_quiz_answer"
    - "get_current_quiz_question"
    - "complete_quiz_session"
    - "get_active_guided_step"
    - "mark_guided_step_complete"
    - "repeat_guided_step"
    - "report_step_blocked"
    - "request_caregiver_help"
    - "record_resident_preference"

# Person Identification Service
person_id:
  url: "${PERSON_ID_SERVICE_URL}"
  timeout: 30
  enabled: true
  min_confidence: 0.5
  include_motion: true

# Person Location Tracking
person_tracking:
  enabled: true
  location_stale_minutes: 30
  ha_propagation: true

# Unified person-location SSOT (PersonLocationService). M38: un-gated from
# cts.enabled and source-arbitrated across world_tracker/face_sighting/sensor.
person_location:
  inferred_dwell_max_s: 14400.0  # 4 hours; camera-blind bathroom dwell timeout
  revision_horizon_s: 600.0      # 10 minutes; mirrors cts.revision_horizon_s
  # Staleness handoff: seconds of quiet on the open segment's current source
  # before a lower-priority source may take over.
  arbitration_staleness_s: 30.0
  # Per-source quiet gaps for *observed* segments (an inferred segment keeps
  # using inferred_dwell_max_s above). A dense source ages out fast; a
  # sparse, rule-driven source stays credible far longer by design.
  quiet_gap_world_tracker_s: 300.0    # 5 minutes
  quiet_gap_face_sighting_s: 2700.0    # 45 minutes
  quiet_gap_sensor_s: 1800.0          # 30 minutes

# Continuous Tracking Service / Tracking Orchestrator Service
# Note: the CTS BFF gateway URL lives under cts.upstream.tracking_orchestrator
# (supports mTLS). This url is used only for the /health proxy in the dashboard.
tracking_orchestrator:
  url: "${TRACKING_ORCHESTRATOR_URL}"   # e.g. http://localhost:8500
  timeout: 5

# Scene Analysis Service
scene_analysis:
  url: "${SCENE_ANALYSIS_URL}"          # e.g. http://localhost:8300
  enabled: true
  timeout: 30

# Semantic Memory Service (also provides object trend tracking API)
# Re-enabled 2026-07-21 (DL-M01 diagnosis): the service is reachable and the
# CTS scene.samples consumer has zero lag; this flag was the only thing
# preventing every consumed sample from being persisted. See the dated
# "L1 diagnosis result" addendum in daily-living-m00-*.md for the full
# evidence chain.
semantic_memory:
  url: "${SEMANTIC_MEMORY_URL}"         # e.g. http://localhost:8400
  enabled: true
  timeout: 10

# Daily Living program (DL-M01): memory + ledger health surfacing thresholds.
daily_living:
  health:
    # Semantic-memory last write older than this many hours is "stale" on the
    # admin dashboard health tile.
    memory_stale_hours: 24
    # Activity-ledger last write (any type) older than this many hours is
    # "stale" on the admin dashboard health tile.
    ledger_stale_hours: 48
  # DL-M04: activity ledger population (TV, meals). Deployment-specific
  # values (entity id, room names, person id) are placeholders in the
  # daily_living_activity.json rule bundle; these are the shared timing knobs.
  tv:
    # HA media_player entity id backing the watching_tv rules' home_state
    # entity_id extension. Empty disables HaStateCache registration for it.
    media_player_entity: ""
    # She left the TV room this long while the TV was still on: close the
    # watching session (approximated from presence_query's current-room
    # dwell once she is in a different room; see daily_living_tv_close).
    idle_close_minutes: 10
  meals:
    # Re-seating within this gap continues the same meal_eating session
    # (one lunch, not two).
    merge_gap_minutes: 20
  # DL-M06: tea-intent shadow detector. Documented here per the M00 plan-author
  # defaults table; the daily_living_tea_intent_shadow.json rule bundle bakes
  # the current values in as literals (rule bundles do not read settings.yaml
  # at import time), matching the tv/meals bundles above. Change both together.
  intent:
    # Kitchen dwell (presence_dwell filter) before the intent cascade runs;
    # short enough to catch tea, long enough to skip walk-throughs.
    dwell_minutes: 3
    # One intent evaluation per window; enforced as the rule's
    # cool_off_minutes, armed only on a positive verdict (signal_emit's
    # trigger_cooloff), so a negative verdict never suppresses the next poll.
    rate_limit_minutes: 45

# DL-M08: hygiene VLM confirm, shower proxy, and caregiver alert (CC half of
# L9; the CTS half's hygiene.same_clothes.* keys live in the tracking-orchestrator
# settings.yaml). Documented here per the M00 plan-author defaults table; the
# daily_living_hygiene_confirm.json rule bundle bakes the current values in as
# literals (rule bundles do not read settings.yaml at import time). Change both
# together.
hygiene:
  shower:
    # Lookback for the bathroom-dwell shower proxy join.
    window_hours: 26
    # Bathroom dwell at or above this many minutes counts as a plausible
    # shower/wash-up; below this, the same-clothes signal is treated as a
    # missed hygiene routine.
    min_bathroom_dwell_minutes: 8
  alert:
    # Attach the two days' evidence crops to the Telegram alert. Hygiene
    # crops are more sensitive than a kitchen snapshot; flip to false (edit
    # the rule's alert_missed_hygiene step's telegram_image_source to "none")
    # to keep text-only alerts while leaving this default documented here.
    include_images: true

# DL-M09: novelty_gate step default. CLIP-embedding cosine distance below
# this vs. the last analyzed frame for a scope means "scene unchanged,
# skip" (saves the tier-3/4 model calls downstream). Per-step config can
# override; this is the authoring default only.
novelty_gate:
  min_distance: 0.06

# Embedding inference (Triton)
embedding:
  triton_url: "${EMBEDDING_TRITON_URL}"
  model_name: "embeddinggemma-300m"
  tokenizer_path: "/opt/models/embeddinggemma/tokenizer.json"
  dim: 768
  max_seq_len: 2048
  batch_size: 16

# Knowledge repository
knowledge:
  chunk_size_tokens: 400
  chunk_overlap_tokens: 60
  retrieval_top_k: 8
  min_similarity: 0.55
  answer_model: "gemma4_26b"
  paraphrase_model: "gemma4_26b"
  quiz_generation_model: "gemma4_26b"
  max_upload_bytes: 15728640
  max_pixels: 40000000
  allowed_mime_types: ["image/jpeg", "image/png", "image/webp", "image/heic"]
  layouts_file: "config/knowledge_layouts.yaml"
  voice_config_file: "config/knowledge_voice.yaml"

# Image rendering for eInk display
image:
  template_dir: "backend/assets/images/templates"
  output_dir: "backend/assets/images"
  font_dir: "backend/assets/fonts"
  default_font: "NotoSansTamil-Regular.ttf"
  default_template: "default"
  alert_template: "alert"
  default_expiry_minutes: 15
  display_width: 800
  display_height: 480
  # Minimum minutes between forced full-refresh cycles for unchanged content.
  # When a device polls and the image hash matches what was last served AND this
  # window has not elapsed, a 204 No Content is returned so the display skips
  # its pixel-refresh cycle.  Set to 0 to always refresh.
  refresh_window_minutes: 60

# Per-camera configuration (keyed by sensor_id)
#
# rotate:        optional - clockwise rotation applied before saving to MinIO.
#                Accepted values: 90, 180, 270.  Omit or set to 0 to skip.
#
# label_filter:  optional - drop images when the on-device YOLO11 detections
#                do not satisfy the filter.
#   labels:      list of label strings to match against payload.data.labels.
#   mode:        "any" (default) - pass if at least one label is detected.
#                "all"           - pass only when every label is detected.
#
# cameras:
#   recamera_kitchen:
#     rotate: 90
#     label_filter:
#       labels: ["person"]
#       mode: "any"
cameras: {}

# Memory query service (semantic memory caching)
memory_query:
  cache:
    enabled: false
    ttl_seconds: 30
    maxsize: 256

# Presence service configuration
# Block 1 stub: CTS-only provider with configurable TTL.
# Block 3 introduces the full provider chain in config/presence.yaml.
presence:
  cts_ttl_seconds: 120

# Redis (required when cts.enabled=true)
redis:
  url: "${REDIS_URL}"

# Continuous Tracking System (CTS), gated by feature flag
cts:
  enabled: true
  # Active per-camera ceiling for CTS VLM candidates. Metadata is never dropped.
  image_rate_per_second: 0.5
  # Small token burst preserves brief activity without allowing sustained overload.
  image_rate_burst: 2.0
  # Optional rates keyed by camera_id, for example: {kitchen_cam: 1.0}
  image_rate_overrides: {}

  # Redis Streams config (M8/M9 subscribers).
  consumer_id: "${HOSTNAME}"
  tracking_events_stream: "tracking.events"
  revisions_stream: "tracking.revisions"
  signals_stream: "tracking.signals"
  scene_samples_stream: "scene.samples"

  # Source-authority lock: how long a CTS PersonLocationState write is
  # protected from a subsequent out-of-order CTS event (seconds).
  lock_seconds: 60

  # M06: fallback identity-revision supersession window (seconds) for
  # automatic revisions carrying no explicit range_start/range_end. Mirrors
  # CTS resolver.revision_horizon_s; change both together.
  revision_horizon_s: 600.0

  # M38 shipped this publishing flag default false because the proto could
  # not represent "no floor point" and reCamera camera ids never match CTS
  # camera ids. identity-continuity M09 fixes both (has_floor_point wire
  # flag, room-level matching) and flips this default to true: the resolver
  # side starts in shadow mode (resolver.cc_assertion_mode on the CTS side),
  # so publishing now is safe and is required for the shadow measurement to
  # collect data.
  identity_assertions:
    publish_enabled: true

  # Service JWT signing (EdDSA).  Leave blank for dev mode (no JWT).
  jwt:
    private_key_pem: ""   # PEM-encoded Ed25519 private key
    kid: "cts-svc-key-1"

  # BFF gateway clients.  When ca_file is absent, mTLS is disabled (dev mode).
  upstream:
    rtsp_ingress:
      url: "${CTS_INGRESS_URL}"
      timeout_s: 5.0
      ca_file: ""          # Leave blank for dev; set to CA cert path for prod
      client_cert: ""
      client_key: ""

    tracking_orchestrator:
      url: "${CTS_ORCHESTRATOR_URL}"
      timeout_s: 5.0
      ca_file: ""
      client_cert: ""
      client_key: ""

# CTS UI feature flags
cts_ui:
  calibration_enabled: true
  dashboard_enabled: true
  live_view_enabled: true   # Enabled in M9

# Logging
logging:
  level: "INFO"
