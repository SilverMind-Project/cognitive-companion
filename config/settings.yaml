# Cognitive Companion v2 - Main Settings
# Environment variables can be interpolated with ${ENV_VAR} syntax.

app:
  name: "Cognitive Companion"
  version: "2.0.0"
  timezone: "America/New_York"
  debug: false

server:
  host: "0.0.0.0"
  port: 8000

cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "https://nanai.khoofia.com"

database:
  # PostgreSQL connection (replaces SQLite)
  # Connection string format: postgresql+psycopg://{user}:{password}@{host}:{port}/{db}
  url: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
  
  # Connection pool settings
  pool_size: 5              # Number of connections to maintain in the pool
  max_overflow: 10          # Maximum number of connections to create beyond pool_size
  pool_timeout: 30          # Seconds to wait before giving up on getting a connection
  pool_recycle: 3600        # Seconds before recycling a connection (1 hour)
  pool_pre_ping: true       # Test connections for liveness before using them
  
  # Echo SQL statements to logs (set to true for debugging)
  echo: false

# LLM provider configuration
llm:
  # Named model registry for the unified llm_call pipeline step.
  # Each entry is independently selectable per step via its id.
  #
  # api_type:         "openai"  = /v1/chat/completions (vLLM, llama.cpp, etc.)
  #                   "ollama"  = /api/chat
  # capabilities:     subset of [text, vision, translation]
  # guided_decoding:  true for vLLM (passes guided_json); false for llama.cpp
  #                   (appends schema as a prompt instruction instead)
  models:
    - id: "cosmos_reason2"
      name: "Cosmos Reason2 8B (Vision)"
      api_type: "openai"
      base_url: "${VISION_MODEL_URL}"
      model: "nvidia/Cosmos-Reason2-8B"
      capabilities: ["text", "vision"]
      max_tokens: 16000
      timeout: 120
      guided_decoding: true
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

    - id: "gemma-4-26B-A4B-it"
      name: "Gemma 4 26B (General)"
      api_type: "openai"
      base_url: "${GEMMA_MODEL_URL}"
      model: "gemma-4-26B-A4B-it"
      capabilities: ["text", "vision", "translation"]
      max_tokens: 32000
      timeout: 120
      guided_decoding: false
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

    - id: "qwen-3.6-35b"
      name: "Qwen 3.6 35b MOE (General)"
      api_type: "openai"
      base_url: "${GEMMA_MODEL_URL}"
      model: "qwen-3.6-35b"
      capabilities: ["text", "vision", "translation"]
      max_tokens: 32000
      timeout: 180
      guided_decoding: false
      max_retries: 3
      supports_thinking: true
      temperature: 0.7
      top_p: 0.9

  realtime:
    provider: "gemini"
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-3.1-flash-live-preview"
    keepalive_interval: 25
    idle_timeout: 120
    system_instruction: >
      The user is a senior citizen living in Knoxville, Tennessee. They are
      originally from India. They may have limited mobility and may not be
      tech-savvy. Use a calm female voice. Process and respond in either simple English (Tamil accent),
      or in simple Chennai Tamil or Tanglish (a mix of Tamil spoken in Chennai
      mixed with English words). DO NOT use any other languages or accents.
      Keep responses concise and easy to understand. DO NOT infer the emotional
      state of the user. Ignore Minimal Input such as '...' or 'um' unless the
      user explicitly says to interpret them.

# TTS configuration (tts-service on port 8200)
tts:
  url: "${TTS_API_URL}"
  default_model: "svara"
  default_voice: "ta_female"
  default_speed: 0.92
  default_language: "ta"
  # Style tag injected when no tag is present in the text.
  # Valid values: neutral, formal, chat, clear, happy, surprise, sad,
  #               fear, anger, disgust, narrative, enthusiastic, laugh, yawn, angry
  default_style: "happy"

# Home Assistant integration
homeassistant:
  url: "${HOME_ASSISTANT_URL}"
  token: "${HOME_ASSISTANT_TOKEN}"
  poll_interval_seconds: 30

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "ai-media"
  config_bucket: "cognitive-companion"
  secure: false
  presigned_expiry_hours: 24

# Event aggregation
event_aggregator:
  batch_size: 5
  window_seconds: 30
  cooldown_seconds: 60
  media_retention_minutes: 30
  # Per-camera image ceiling for reCamera. Devices self-limit, so zero disables it.
  image_rate_per_second: 0.0
  # Zero uses automatic burst capacity, with a minimum of one token.
  image_rate_burst: 0.0

# Conversation history
conversation:
  history_ttl_minutes: 120
  max_turns: 50

# Guided task companion
guided_task:
  max_step_attempts: 3
  step_timeout_s: 300
  resume_grace_s: 600
  safety_tick_s: 20
  escalation_grace_s: 1800
  transcript_retention_days: 30
  escalation_channels: ["telegram", "pwa_popup_text"]
  summon_channels: ["ha_speaker_tts", "pwa_popup_text"]
  rephrase_via: "agent"

# WebSocket
websocket:
  max_connections: 10
  audio_backend: "gemini_live"
  lazy_connect: true

# MCP server
mcp:
  enabled: true
  tools:
    - "get_rooms"
    - "get_sensors"
    - "get_room_occupancy"
    - "get_recent_images"
    - "get_light_level"
    - "get_signals_feed"
    - "get_event_logs"
    - "get_rules"
    - "get_conversation_history"
    - "get_person_locations"
    - "get_person_sightings"
    - "get_person_activities"
    - "get_workflow_executions"
    - "get_rule_pipeline"
    - "trigger_rule"
    - "get_eink_display_status"
    - "get_enrolled_persons"
    - "get_local_datetime"
    - "get_weather"
    - "get_recent_scene_objects"
    - "get_scene_observations"
    - "get_person_movements"
    - "get_room_trend"
    - "search_similar_scenes"
    - "submit_quiz_answer"
    - "get_current_quiz_question"
    - "complete_quiz_session"
    - "get_heatmap"
    - "get_gait_trend"
    - "acknowledge_dementia_signal"
    - "get_guided_completion_summary"
    - "get_guided_attempts_per_step"
    - "get_guided_time_to_complete"
    - "get_guided_abandonment"
    - "get_guided_escalation_breakdown"
    - "get_guided_vision_agreement"
    - "get_guided_time_of_day"
  gemini_tools:
    - "get_rooms"
    - "get_room_occupancy"
    - "get_person_locations"
    - "get_signals_feed"
    - "get_weather"
    - "get_recent_scene_objects"
    - "get_room_trend"
    - "get_person_movements"
    - "get_local_datetime"
    - "get_person_activities"
    - "get_enrolled_persons"
    - "submit_user_response"
    - "query_knowledge_base"
    - "submit_quiz_answer"
    - "get_current_quiz_question"
    - "complete_quiz_session"
    - "get_active_guided_step"
    - "mark_guided_step_complete"
    - "repeat_guided_step"
    - "report_step_blocked"
    - "request_caregiver_help"

# Person Identification Service
person_id:
  url: "${PERSON_ID_SERVICE_URL}"
  timeout: 30
  enabled: true
  min_confidence: 0.5
  include_motion: true

# Person Location Tracking
person_tracking:
  enabled: true
  location_stale_minutes: 30
  ha_propagation: true

# Continuous Tracking Service / Tracking Orchestrator Service
# Note: the CTS BFF gateway URL lives under cts.upstream.tracking_orchestrator
# (supports mTLS). This url is used only for the /health proxy in the dashboard.
tracking_orchestrator:
  url: "${TRACKING_ORCHESTRATOR_URL}"   # e.g. http://localhost:8500
  timeout: 5

# Scene Analysis Service
scene_analysis:
  url: "${SCENE_ANALYSIS_URL}"          # e.g. http://localhost:8300
  enabled: true
  timeout: 30

# Semantic Memory Service (also provides object trend tracking API)
semantic_memory:
  url: "${SEMANTIC_MEMORY_URL}"         # e.g. http://localhost:8400
  enabled: false
  timeout: 10

# Embedding inference (Triton)
embedding:
  triton_url: "${EMBEDDING_TRITON_URL}"
  model_name: "embeddinggemma-300m"
  tokenizer_path: "/opt/models/embeddinggemma/tokenizer.json"
  dim: 768
  max_seq_len: 2048
  batch_size: 16

# Knowledge repository
knowledge:
  chunk_size_tokens: 400
  chunk_overlap_tokens: 60
  retrieval_top_k: 8
  min_similarity: 0.55
  answer_model: "gemma4_26b"
  paraphrase_model: "gemma4_26b"
  quiz_generation_model: "gemma4_26b"
  max_upload_bytes: 15728640
  max_pixels: 40000000
  allowed_mime_types: ["image/jpeg", "image/png", "image/webp", "image/heic"]
  layouts_file: "config/knowledge_layouts.yaml"
  voice_config_file: "config/knowledge_voice.yaml"

# Image rendering for eInk display
image:
  template_dir: "backend/assets/images/templates"
  output_dir: "backend/assets/images"
  font_dir: "backend/assets/fonts"
  default_font: "NotoSansTamil-Regular.ttf"
  default_template: "default"
  alert_template: "alert"
  default_expiry_minutes: 15
  display_width: 800
  display_height: 480
  # Minimum minutes between forced full-refresh cycles for unchanged content.
  # When a device polls and the image hash matches what was last served AND this
  # window has not elapsed, a 204 No Content is returned so the display skips
  # its pixel-refresh cycle.  Set to 0 to always refresh.
  refresh_window_minutes: 60

# Per-camera configuration (keyed by sensor_id)
#
# rotate:        optional - clockwise rotation applied before saving to MinIO.
#                Accepted values: 90, 180, 270.  Omit or set to 0 to skip.
#
# label_filter:  optional - drop images when the on-device YOLO11 detections
#                do not satisfy the filter.
#   labels:      list of label strings to match against payload.data.labels.
#   mode:        "any" (default) - pass if at least one label is detected.
#                "all"           - pass only when every label is detected.
#
# cameras:
#   recamera_kitchen:
#     rotate: 90
#     label_filter:
#       labels: ["person"]
#       mode: "any"
cameras: {}

# Memory query service (semantic memory caching)
memory_query:
  cache:
    enabled: false
    ttl_seconds: 30
    maxsize: 256

# Presence service configuration
# Block 1 stub: CTS-only provider with configurable TTL.
# Block 3 introduces the full provider chain in config/presence.yaml.
presence:
  cts_ttl_seconds: 120

# Redis (required when cts.enabled=true)
redis:
  url: "${REDIS_URL}"

# Continuous Tracking System (CTS), gated by feature flag
cts:
  enabled: true
  # Active per-camera ceiling for CTS VLM candidates. Metadata is never dropped.
  image_rate_per_second: 0.5
  # Small token burst preserves brief activity without allowing sustained overload.
  image_rate_burst: 2.0
  # Optional rates keyed by camera_id, for example: {kitchen_cam: 1.0}
  image_rate_overrides: {}

  # Redis Streams config (M8/M9 subscribers).
  consumer_id: "${HOSTNAME}"
  tracking_events_stream: "tracking.events"
  revisions_stream: "tracking.revisions"
  signals_stream: "tracking.signals"
  scene_samples_stream: "scene.samples"

  # Source-authority lock: how long a CTS PersonLocationState write is
  # protected from a subsequent out-of-order CTS event (seconds).
  lock_seconds: 60

  # Service JWT signing (EdDSA).  Leave blank for dev mode (no JWT).
  jwt:
    private_key_pem: ""   # PEM-encoded Ed25519 private key
    kid: "cts-svc-key-1"

  # BFF gateway clients.  When ca_file is absent, mTLS is disabled (dev mode).
  upstream:
    rtsp_ingress:
      url: "${CTS_INGRESS_URL}"
      timeout_s: 5.0
      ca_file: ""          # Leave blank for dev; set to CA cert path for prod
      client_cert: ""
      client_key: ""

    tracking_orchestrator:
      url: "${CTS_ORCHESTRATOR_URL}"
      timeout_s: 5.0
      ca_file: ""
      client_cert: ""
      client_key: ""

# CTS UI feature flags
cts_ui:
  calibration_enabled: true
  dashboard_enabled: true
  live_view_enabled: true   # Enabled in M9

# Logging
logging:
  level: "INFO"
