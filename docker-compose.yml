# Cognitive Companion - Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
#
# External services (assumed running separately):
#   - Person Identification Service (GPU)  see ../person-identification-service/
#   - vLLM (Cosmos + TranslateGemma)  GPU inference servers
#   - Ollama  logic reasoning LLM
#   - Home Assistant  smart home integration
#   - MinIO  S3-compatible object storage
#   - TTS service  text-to-speech
#
# GPU-accelerated services (optional):
#   - scene-analysis-service  YOLO + Florence-2 + CLIP  see ../scene-analysis-service/

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: cc-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (Vue 3 + Vuetify) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  backend-data:
    driver: local
  # scene-analysis-models:
  #   driver: local
