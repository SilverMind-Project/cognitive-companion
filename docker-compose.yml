# Cognitive Companion - Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
#
# Prerequisites (start these first):
#   - Shared PostgreSQL:  cd ../db && docker compose up -d
#   - Continuous Tracking (Redis + Triton + orchestrator + rtsp-ingress)
#   - Person Identification Service (GPU)
#   - Semantic Memory Service
#   - TTS service
#   - vLLM (Cosmos + TranslateGemma)  GPU inference servers
#   - Ollama  logic reasoning LLM
#   - Home Assistant  smart home integration
#   - MinIO  S3-compatible object storage
#   - Scene Analysis Service  YOLO + Florence-2 + CLIP
#
# The shared PostgreSQL instance hosts all databases and must be started
# first (see ../db/docker-compose.db.yml).  This compose file no longer
# includes it — start it independently to avoid container-name conflicts.

services:
  # ─── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    networks:
      - nanai
    healthcheck:
      test: ["CMD", "backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Frontend (Vue 3 + Vuetify) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - nanai
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  backend-data:
    driver: local

networks:
  nanai:
    name: nanai
    external: true
