# Cognitive Companion - Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d
#
# External services (assumed running separately):
#   - Person Identification Service (GPU)  see ../person-identification-service/
#   - vLLM (Cosmos + TranslateGemma)  GPU inference servers
#   - Ollama  logic reasoning LLM
#   - Home Assistant  smart home integration
#   - MinIO  S3-compatible object storage
#   - TTS service  text-to-speech
#
# GPU-accelerated services (optional):
#   - scene-analysis-service  YOLO + Florence-2 + CLIP  see ../scene-analysis-service/
#
# The shared PostgreSQL container is provided by ../docker-compose.db.yml
# which is included below.  That single instance hosts all three databases.

include:
  - ../docker-compose.db.yml

services:
  # ─── Backend API ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    env_file:
      - .env
    networks:
      - nanai
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${CC_DB_USER:-cc_user}
      - POSTGRES_PASSWORD=${CC_DB_PASSWORD:?err}
      - POSTGRES_DB=cognitive_companion
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Frontend (Vue 3 + Vuetify) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  nanai:
    name: nanai
    external: true

volumes:
  backend-data:
    driver: local
  # scene-analysis-models:
  #   driver: local
