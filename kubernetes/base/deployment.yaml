apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api-gateway
  labels:
    app: ai-api-gateway
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-api-gateway
  template:
    metadata:
      labels:
        app: ai-api-gateway
        version: v2
    spec:
      containers:
      - name: ai-api-gateway
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: cc-secrets
        - configMapRef:
            name: cc-config
        - configMapRef:
            name: minio-config
        - secretRef:
            name: minio-secret
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cc-backend-data
      - name: config
        configMap:
          name: cc-config-files
