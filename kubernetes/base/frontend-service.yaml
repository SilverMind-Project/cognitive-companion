# Frontend service - ClusterIP only.
# Exposed externally via nginx ingress at nanai.khoofia.com.
apiVersion: v1
kind: Service
metadata:
  name: cognitive-companion-ui-svc
  labels:
    app: cognitive-companion-ui
    version: v2
spec:
  type: ClusterIP
  selector:
    app: cognitive-companion-ui
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
