# Sensitive environment variables — fill in base64-encoded values before applying.
#
# Encode a value:  echo -n "your-value" | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: cc-secrets
  labels:
    app: ai-api-gateway
type: Opaque
data:
  GEMINI_API_KEY: ""            # echo -n "your-key" | base64
  HOME_ASSISTANT_TOKEN: ""      # echo -n "your-token" | base64
  TELEGRAM_BOT_TOKEN: ""        # echo -n "your-token" | base64
  TELEGRAM_CAREGIVER_CHAT_ID: ""
  TELEGRAM_OPENCLAW_CHAT_ID: ""
  CC_ADMIN_API_KEY: ""          # echo -n "change-me-admin-key" | base64
  CC_CAREGIVER_API_KEY: ""      # echo -n "change-me-caregiver-key" | base64
  CC_MCP_API_KEY: ""            # echo -n "change-me-mcp-key" | base64
